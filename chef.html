<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #201f1d; --panel: #2b2a27; --line: #3d3b37; --text: #f1ece3;
    --muted: #a8a196; --amber: #e9a63b; --ok: #7cc48a; --bad: #e77a6b;
    --head: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px 16px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-family: var(--head); font-size: 1.5rem; margin: 0; }
  #sound { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text); }
  #sound[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  h2 { font-family: var(--head); font-size: 1.15rem; margin: 26px 0 10px; color: var(--amber); }
  h2 span { color: var(--muted); font-weight: 400; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .empty { color: var(--muted); padding: 6px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; }
  .card.new { border-color: var(--amber); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .head b { font-family: var(--head); font-size: 1.5rem; }
  .head small { color: var(--muted); }
  ul { list-style: none; margin: 10px 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li .q { min-width: 32px; color: var(--amber); font-weight: 700; }
  .note { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: rgba(233,166,59,.14); color: var(--amber); font-size: .92rem; }
  .foot { margin-top: auto; }
  .total { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 10px; }
  .act { width: 100%; padding: 13px; border: 0; border-radius: 10px; font-weight: 700; font-size: 1rem; }
  .act.confirm { background: var(--amber); color: #1b1a18; }
  .act.done { background: transparent; border: 1.5px solid var(--ok); color: var(--ok); }
  #msg { color: var(--bad); min-height: 1.3em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Kitchen orders</h1>
    <button id="sound" aria-pressed="false">Sound off</button>
  </div>
  <p id="msg" role="alert"></p>

  <h2>New <span id="nNew"></span></h2>
  <div class="grid" id="newList"></div>

  <h2>Confirmed <span id="nConf"></span></h2>
  <div class="grid" id="confList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAe_YNUjcL-ANqTH1YJ_u5EJ7mGZu-xQdw",
    authDomain: "skyewalk-web.firebaseapp.com",
    projectId: "skyewalk-web",
    storageBucket: "skyewalk-web.firebasestorage.app",
    messagingSenderId: "963472175218",
    appId: "1:963472175218:web:7e27ae19ba16147ff652eb"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- sound (needs one tap to enable) ---------- */
  let soundOn = false, audioCtx = null;
  $("sound").addEventListener("click", () => {
    soundOn = !soundOn;
    $("sound").setAttribute("aria-pressed", soundOn);
    $("sound").textContent = soundOn ? "Sound on" : "Sound off";
    if (soundOn) { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); beep(); }
  });
  function beep() {
    if (!soundOn || !audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.25);
  }

  /* ---------- orders ---------- */
  const seen = new Set();
  let firstLoad = true;

  const timeOf = o => o.createdAt && o.createdAt.toDate ? o.createdAt.toDate() : null;
  const clock = d => d ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "just now";

  function cardHtml(o) {
    const items = (o.items || []).map(i => `<li><span class="q">${esc(i.qty)}&times;</span><span>${esc(i.name)}</span></li>`).join("");
    const isNew = o.status === "new";
    return `<div class="card ${isNew ? "new" : ""}">
      <div class="head"><b>Table ${esc(o.table)}</b><small>${clock(timeOf(o))}</small></div>
      <ul>${items}</ul>
      ${o.note ? `<p class="note">${esc(o.note)}</p>` : ""}
      <div class="foot">
        <div class="total"><span>Total</span><span>&#8377;${esc(o.total)}</span></div>
        <button class="act ${isNew ? "confirm" : "done"}" data-id="${esc(o.id)}" data-to="${isNew ? "confirmed" : "done"}">
          ${isNew ? "Confirm order" : "Mark as done"}
        </button>
      </div>
    </div>`;
  }

  function render(orders) {
    const byTime = (a, b) => (timeOf(a) || new Date()) - (timeOf(b) || new Date());
    const fresh = orders.filter(o => o.status === "new").sort(byTime);
    const conf = orders.filter(o => o.status === "confirmed").sort(byTime);
    $("nNew").textContent = fresh.length ? "(" + fresh.length + ")" : "";
    $("nConf").textContent = conf.length ? "(" + conf.length + ")" : "";
    $("newList").innerHTML = fresh.length ? fresh.map(cardHtml).join("") : `<p class="empty">No new orders.</p>`;
    $("confList").innerHTML = conf.length ? conf.map(cardHtml).join("") : `<p class="empty">Nothing being prepared.</p>`;
  }

  db.collection("orders").where("status", "in", ["new", "confirmed"]).onSnapshot(snap => {
    $("msg").textContent = "";
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!firstLoad && orders.some(o => o.status === "new" && !seen.has(o.id))) beep();
    orders.forEach(o => seen.add(o.id));
    firstLoad = false;
    render(orders);
  }, err => {
    console.error(err);
    $("msg").textContent = "Could not load orders: " + err.message;
  });

  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-id]");
    if (!b) return;
    b.disabled = true;
    try {
      await db.collection("orders").doc(b.dataset.id).update({ status: b.dataset.to });
    } catch (err) {
      console.error(err);
      $("msg").textContent = "Could not update the order. Please try again.";
      b.disabled = false;
    }
  });
</script>
</body>
</html>
